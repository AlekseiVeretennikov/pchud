<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Static fine paint grain; neutral grey is transparent under soft-light blending. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.65" intercept="0.175"/>
      <feFuncG type="linear" slope="0.65" intercept="0.175"/>
      <feFuncB type="linear" slope="0.65" intercept="0.175"/>
      <feFuncA type="linear" slope="0" intercept="0.7"/>
    </feComponentTransfer>
  </filter>
  <rect width="192" height="192" filter="url(#grain)"/>
</svg>
